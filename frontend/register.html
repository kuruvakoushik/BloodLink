<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · BloodLink</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/main.js"></script><script defer src="/js/auth.js"></script></head><body><nav class="nav"><div class="container nav-inner"><a class="brand" href="/"><span class="brand-mark">♥</span>BloodLink</a><div class="links"><a href="/find-donors.html">Find donors</a><a href="/request-blood.html">Request blood</a><a href="/login.html">Sign in</a></div></div></nav><main class="content"><div class="container form-wrap"><div class="page-head"><div class="eyebrow">Join the community</div><h1>Create your account</h1><p>Set up a secure account to create donor profiles and blood requests.</p></div><form id="register-form" class="panel"><div class="message hidden" role="status"></div><div class="form-grid"><div class="field full"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required maxlength="120"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div><div class="field"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required></div><div class="field"><label for="state">State</label><input id="state" name="state" autocomplete="address-level1" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required><span class="help">Use at least 10 characters.</span></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="10" autocomplete="new-password" required></div></div><div class="form-actions"><button class="btn" type="submit">Create account</button></div></form></div></main><footer class="footer"><div class="container"><a class="brand" style="color:white" href="/">♥ BloodLink</a><p>Emergency? Call or visit a hospital or licensed blood bank.</p></div></footer></body></html>
