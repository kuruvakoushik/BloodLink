<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a donor · BloodLink</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/main.js"></script><script defer src="/js/donors.js"></script></head><body><nav class="nav"><div class="container nav-inner"><a class="brand" href="/"><span class="brand-mark">♥</span>BloodLink</a><div class="links"><a href="/find-donors.html">Find donors</a><a href="/request-blood.html">Request blood</a><a href="/dashboard.html">Dashboard</a></div></div></nav><main><header class="container page-head"><div class="eyebrow">Volunteer profile</div><h1>Become a donor</h1><p>Share your availability with people searching for help in your area.</p></header><section class="container content form-wrap"><form id="donor-form" class="panel"><div class="message hidden" role="status"></div><div class="form-grid"><div class="field"><label for="bloodGroup">Blood group</label><select id="bloodGroup" name="bloodGroup" required><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="18" max="100" required></div><div class="field"><label for="gender">Gender (optional)</label><input id="gender" name="gender" maxlength="30"></div><div class="field"><label for="lastDonationDate">Last donation date (optional)</label><input id="lastDonationDate" name="lastDonationDate" type="date"></div><div class="field"><label for="city">City</label><input id="city" name="city" required></div><div class="field"><label for="state">State</label><input id="state" name="state" required></div><div class="field"><label for="contactPreference">Contact preference</label><select id="contactPreference" name="contactPreference"><option value="enquiry">BloodLink enquiry (recommended)</option><option value="phone">Show my phone to searchers</option><option value="hidden">Hide contact details</option></select></div><div class="field"><label for="isAvailable">Availability</label><select id="isAvailable" name="isAvailable"><option value="true">Available</option><option value="false">Not available</option></select></div></div><div class="notice" style="margin-top:18px">This profile does not assess donation eligibility. A licensed blood bank will make that decision.</div><div class="form-actions"><button class="btn" type="submit">Save donor profile</button></div></form></section></main><footer class="footer"><div class="container"><a class="brand" style="color:white" href="/">♥ BloodLink</a></div></footer></body></html>
